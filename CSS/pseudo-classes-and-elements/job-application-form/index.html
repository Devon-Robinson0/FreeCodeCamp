<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <form>
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name" 
            />
            <label for="email">Email</label>
            <input 
                type="email"
                id="email" 
            />
            <label for="position">Job Position</label>
            <select id="position">
                <option value="security">Security</option>
                <option value="security">Front End</option>
                <option value="security">Back End</option>
            </select>
            <fieldset class="radio-group">
                <input id="full-time" type="radio" name="availability" />
                <label for="full-time"> Full Time</label>
                <input id="part-time" type="radio" name="availability" />
                <label for="part-time"> Part Time</label>
            </fieldset>
            <label for="message">Any Additional Notes?</label>
            <textarea id="message"></textarea>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
