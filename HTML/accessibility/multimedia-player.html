<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
  <h1>Main Title</h1>
  <section>
    <h2>Title of song</h2>
    <audio controls aria-label="audio of">
      <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio/mp3">
    </audio>
  </section>
  <section>
    <h2>Title of Video</h2>
    <video controls width="1000" aria-label="Video">
      <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
      <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" kind="subtitles" srclang="en" label="Subtitles">
    </video>
  </section>
  <section>
    <h2>Transcript</h2>
    <p>This video transcript</p>
  </section>
</body>

</html>
